<!DOCTYPE html>
<html>
<body>

<h1>Playlist Manager</h1>

<!-- Instructions -->
<p><strong>How to use:</strong></p>
<ul>
  <li>Type an artist and a song title in the box and click <strong>Add</strong> to add a song to the playlist.</li>
  <li>Click <strong>E</strong> next to a song to edit its title.</li>
  <li>Click <strong>D</strong> next to a song to delete it from your playlist.</li>
  <li>Your playlist updates immediately after each action.</li>
</ul>

<!-- Add Song -->
<form id="form">
  <input id="title" required placeholder="Enter song title">
  <button>Add</button>
</form>

<!-- Play List -->
<ul id="list"></ul>

<script src="main.js"></script>
</body>
</html>
